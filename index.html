<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Training - Sumit</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background-color: #ffffff;
            border-radius: 12px;
            padding: 50px 60px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            max-width: 600px;
            width: 90%;
        }

        h1 {
            color: #2b5580;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 16px;
        }

        h2 {
            color: #43a047;
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 24px;
        }

        p {
            color: #333333;
            font-size: 15px;
            margin-bottom: 12px;
        }

        .deployed-text {
            color: #222222;
            font-size: 14px;
            margin-bottom: 28px;
        }

        button {
            background-color: #efefef;
            color: #000000;
            border: 1px solid #767676;
            border-radius: 3px;
            padding: 6px 16px;
            font-size: 13px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        button:hover {
            background-color: #e2e2e2;
        }
    </style>
</head>

<body>

    <div class="card">
        <h1>DevOps Training - Sumit</h1>
        <h2>CI/CD Deployment Successful</h2>
        <p><strong>Version:</strong> 2.0</p>
        <p class="deployed-text">Deployed using <strong>GitHub Actions</strong></p>
        <button id="verifyBtn" onclick="verifyDeployment()">Verify Deployment</button>
    </div>

    <script>
        function verifyDeployment() {
            alert("Deployment Verified! Static website is successfully running on AWS S3.");
        }
    </script>

</body>

</html>
